services:
  - type: web
    name: turismo-api
    runtime: php
    buildCommand: composer install --no-dev || true
    startCommand: php -S 0.0.0.0:$PORT -t .
    envVars:
      - key: PDO_HOST
        sync: false
      - key: PDO_PORT
        sync: false
      - key: PDO_DATABASE
        value: app_turistica_la_paz
      - key: PDO_USERNAME
        sync: false
      - key: PDO_PASSWORD
        sync: false
      - key: PDO_SSL_CA
        value: config/ca.pem
    plan: free
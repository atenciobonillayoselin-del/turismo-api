# ============================================================
# Render.com - Blueprint de despliegue (v3.0 - DOCKER NATIVO)
# Archivo: render.yaml
# ============================================================
# ⚠️ IMPORTANTE:
#   Render YA NO tiene runtime PHP nativo. DESDE 2025 usamos DOCKER.
#   Dockerfile incluido en la raíz: ./Dockerfile (PHP 8.3 + Apache)
#
# PASO 1 (ANTES DE DESPLEGAR):
#   Haz commit & push al repo de:
#     ✅ Dockerfile             (raíz del proyecto)
#     ✅ .dockerignore          (raíz del proyecto)
#     ✅ render.yaml            (raíz del proyecto - ESTE archivo)
#     ✅ api/                   (endpoints de la API)
#     ✅ config/                (database.php, ca.pem)
#
# PASO 2 (Render.com):
#   OPCIÓN A (Blueprints - RECOMENDADO):
#     1. Ve a https://dashboard.render.com → Blueprints → "New Blueprint Instance"
#     2. Selecciona tu repo → connect → deja el nombre por defecto
#     3. Render detecta AUTOMÁTICAMENTE este render.yaml
#     4. Ve al servicio creado → Environment → completa las variables "sync: false"
#        (PDO_PASSWORD, etc.)
#     5. Save Changes → deploy automático
#
#   OPCIÓN B (Manual si Blueprint no funciona):
#     1. Dashboard → New → Web Service
#     2. Elige tu repo GitHub
#     3. Runtime = "Docker" (¡IMPORTANTE! No elijas PHP, no existe ya)
#     4. Root Directory = ./  (raíz, donde está el Dockerfile)
#     5. Region = Oregon / EU Frankfurt (cerca de La Paz, Bolivia)
#     6. Plan = Free (o Starter si quieres más recursos)
#     7. Environment → agrega las variables de la sección de abajo
#     8. "Create Web Service" → esperar build ~3-5 min
#
# PASO 3 (DESPUÉS de desplegar):
#   Abre → https://TU-SERVICIO.onrender.com/api/test_connection.php
#   Debe decir: "✅ Conexión exitosa"
# ============================================================

services:
  - type: web
    name: turismo-api
    # ============================================================
    # ✅ RUNTIME = DOCKER (Render requiere Docker para PHP 2025+)
    # ============================================================
    runtime: docker
    # Dockerfile está en la raíz del proyecto
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    region: oregon

    # Configs de autodeploy
    autoDeploy: true
    branch: main
    pullPreviews: false

    # Puerto Render → mapeado dinámicamente por el entrypoint del Dockerfile
    # (el Dockerfile reemplaza el Listen 80 de Apache al $PORT de Render)

    # Health check (Render usa esto para saber si el contenedor arrancó bien)
    healthCheckPath: /api/test_connection.php
    healthCheckInitialWaitSeconds: 20
    healthCheckIntervalSeconds: 60
    healthCheckTimeoutSeconds: 5

    # ============================================================
    # ENVIRONMENT VARIABLES
    # ============================================================
    # sync: false → requieren que TÚ pongas el valor en Dashboard → Environment
    # sync: true  → valor por defecto ya configurado
    # ============================================================
    envVars:

      # ============================================================
      # 🟥 OBLIGATORIAS - BASE DE DATOS AIVEN MYSQL
      # ============================================================
      - key: PDO_HOST
        sync: false
        description: "Host MySQL Aiven → mysql-3c89e575-turismo-la-paz.d.aivencloud.com"

      - key: PDO_PORT
        sync: false
        description: "Puerto MySQL Aiven → 23909"

      - key: PDO_DATABASE
        value: defaultdb
        description: "Nombre de la BD en Aiven → defaultdb"

      - key: PDO_USERNAME
        sync: false
        description: "Usuario MySQL Aiven → avnadmin"

      - key: PDO_PASSWORD
        sync: false
        description: "🔑 CONTRASEÑA MySQL Aiven (OBLIGATORIA - no dejar vacía)"

      - key: PDO_SSL_CA
        value: config/ca.pem
        description: "Ruta al certificado SSL CA de Aiven → config/ca.pem (debe existir en el repo)"

# ============================================================
# ✅ POST-DEPLOY CHECKLIST (después de que termine el build):
# ============================================================
# 1) Abre /api/test_connection.php
#      Esperado: JSON {"success":true,"mensaje":"✅ Conexión exitosa..."}
#
# 2) Abre /api/lugares.php
#      Esperado: Array JSON con lugares turísticos (o vacío si no hay datos)
#
# 3) (Solo si algo falla) → Logs del servicio en Render.com
#      Busca líneas como:
#        "🐳 Configurando Apache para puerto=10000"
#        "🚀 PHP 8.3.x + Apache inicializado"
# ============================================================
